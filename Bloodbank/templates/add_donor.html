{% extends "layout.html" %}
{% block title %}Add Donor{% endblock %}
{% block page_title %}Add New Donor{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2><i class="fa fa-user-plus"></i> Register Donor</h2>
      <a href="{{ url_for('donors') }}" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a>
    </div>
    <form method="POST" action="{{ url_for('add_donor') }}" id="donorForm">
      <div class="form-grid">
        <div class="form-group"><label>Full Name *</label><input type="text" name="name" placeholder="e.g. Arjun Sharma" required></div>
        <div class="form-group"><label>Age * (18–65)</label><input type="number" name="age" placeholder="25" min="18" max="65" required></div>
        <div class="form-group">
          <label>Blood Group *</label>
          <select name="blood_group" required>
            <option value="">Select Blood Group</option>
            {% for bg in blood_groups %}<option value="{{ bg }}">{{ bg }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Phone Number * (10 digits)</label><input type="tel" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required></div>
        <div class="form-group"><label>Email Address</label><input type="email" name="email" placeholder="donor@example.com"></div>
        <div class="form-group"><label>Address</label><input type="text" name="address" placeholder="City, State"></div>
        <div class="form-group">
          <label>Last Donation Date</label>
          <input type="date" name="last_donation" id="lastDonation">
          <small id="eligNote" class="elig-note"></small>
        </div>
        <div class="form-group"><label>Units to Donate *</label><input type="number" name="units" value="1" min="1" max="10" required></div>
      </div>
      <div class="form-group full-width" style="padding:0 24px;">
        <div class="info-box"><i class="fa fa-circle-info"></i> Donors must wait at least <strong>90 days</strong> between donations. Eligibility is auto-calculated.</div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-red"><i class="fa fa-check"></i> Register Donor</button>
        <a href="{{ url_for('donors') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
document.getElementById('lastDonation').addEventListener('change', function() {
  const diff = Math.floor((new Date() - new Date(this.value)) / 86400000);
  const note = document.getElementById('eligNote');
  if (diff >= 90) { note.textContent = '✅ Eligible (' + diff + ' days ago)'; note.style.color = '#22c55e'; }
  else { note.textContent = '⏳ Not yet eligible. ' + (90 - diff) + ' days remaining.'; note.style.color = '#f59e0b'; }
});
</script>
{% endblock %}
