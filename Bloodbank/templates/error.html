{% extends "layout.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:16px;">
  <div style="font-family:var(--font-display);font-size:5rem;color:var(--red)">{{ code }}</div>
  <div style="font-size:1.1rem;color:var(--text-muted)">{{ msg }}</div>
  <a href="{{ url_for('index') }}" class="btn btn-red"><i class="fa fa-house"></i> Go Home</a>
</div>
{% endblock %}
