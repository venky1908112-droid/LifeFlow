{% extends "layout.html" %}
{% block title %}Update Donor{% endblock %}
{% block page_title %}Update Donor{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2><i class="fa fa-pen-to-square"></i> Edit Donor — {{ donor.donor_code }}</h2>
      <a href="{{ url_for('donors') }}" class="btn-back"><i class="fa fa-arrow-left"></i> Back</a>
    </div>
    <form method="POST" action="{{ url_for('update_donor', donor_id=donor.id) }}">
      <div class="form-grid">
        <div class="form-group"><label>Full Name *</label><input type="text" name="name" value="{{ donor.name }}" required></div>
        <div class="form-group"><label>Age *</label><input type="number" name="age" value="{{ donor.age }}" min="18" max="65" required></div>
        <div class="form-group">
          <label>Blood Group *</label>
          <select name="blood_group" required>
            {% for bg in blood_groups %}<option value="{{ bg }}" {% if donor.blood_group == bg %}selected{% endif %}>{{ bg }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Phone Number</label><input type="tel" name="phone" value="{{ donor.phone }}"></div>
        <div class="form-group"><label>Email Address</label><input type="email" name="email" value="{{ donor.email or '' }}"></div>
        <div class="form-group"><label>Address</label><input type="text" name="address" value="{{ donor.address or '' }}"></div>
        <div class="form-group"><label>Last Donation Date</label><input type="date" name="last_donation" value="{{ donor.last_donation.isoformat() if donor.last_donation else '' }}"></div>
        <div class="form-group"><label>Units</label><input type="number" name="units" value="{{ donor.units_donated }}" min="0" max="20"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-red"><i class="fa fa-save"></i> Save Changes</button>
        <a href="{{ url_for('donors') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
